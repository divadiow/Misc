name: Build Hotspot Devices

on:
  push:
    branches:
      - hotspot-devices-app-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK and XAPK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HotspotDevices-v1.0.0.apk
          python3 scripts/make_xapk.py
          sha256sum dist/HotspotDevices-v1.0.0.apk dist/HotspotDevices-v1.0.0.xapk > dist/SHA256SUMS.txt

      - name: Upload installables
        uses: actions/upload-artifact@v4
        with:
          name: HotspotDevices-v1.0.0
          path: |
            dist/HotspotDevices-v1.0.0.apk
            dist/HotspotDevices-v1.0.0.xapk
            dist/SHA256SUMS.txt
          if-no-files-found: error
